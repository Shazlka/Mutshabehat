<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متشابهات القرآن الكريم</title>
  <link rel="stylesheet" href="css/01-base.css?v=v82b_split">
  <link rel="stylesheet" href="css/02-header.css?v=v82b_split">
  <link rel="stylesheet" href="css/03-layout.css?v=v82b_split">
  <link rel="stylesheet" href="css/04-filters.css?v=v82b_split">
  <link rel="stylesheet" href="css/05-cards.css?v=v82b_split">
  <link rel="stylesheet" href="css/06-modals-forms.css?v=v82b_split">
  <link rel="stylesheet" href="css/07-settings-dashboard.css?v=v82b_split">
  <link rel="stylesheet" href="css/08-mobile-base.css?v=v82b_split">
  <link rel="stylesheet" href="css/09-fonts-quran.css?v=v82b_split">
  <link rel="stylesheet" href="css/10-v78-features.css?v=v82b_split">
  <link rel="stylesheet" href="css/11-github-sync.css?v=v82b_split">

  <link rel="stylesheet" href="polish.css?v=v82b_polish">  
  <link rel="stylesheet" href="mobile-filter.css?v=v82b_mobile_filter">   
</head>
<body data-theme="quran-classic" data-font-preset="normal-quran" data-testid="app-root">
<header class="app-header" data-testid="header">
  <div class="brand"><div class="logo">ق</div><div><h1>متشابهات القرآن الكريم</h1></div></div>
  <button class="mobile-menu-btn" onclick="openMobileMenu()">☰</button>
<nav class="header-actions" data-testid="sidebar">
    <button onclick="openHome()" data-testid="nav-home">الرئيسية</button><button onclick="openDatabase('personal')" data-testid="nav-database">الشخصية</button><button onclick="openDatabase('auto')" data-testid="nav-database-auto">الآلية</button>
    <button onclick="openAddModal()" data-testid="btn-add-record">+ إضافة متشابه</button><button onclick="openDashboard()" data-testid="nav-analysis">الإحصائيات</button><button onclick="openAppSettings()" data-testid="btn-settings">⚙ إعدادات</button>
    <button onclick="openMergeWindow()" data-testid="btn-merge">دمج المجموعات</button><button onclick="resetDualDbCacheV68()" data-testid="btn-refresh">تحديث البيانات</button>
</nav>
</header>

<main id="home" class="home-screen" data-testid="main-content"><section class="hero"><h2>اختر قاعدة البيانات</h2><p>القاعدة الشخصية قابلة للتعديل، والقاعدة الآلية للمراجعة والنسخ والحذف عند تفعيل وضع التعديل.</p><div class="choice-grid"><button class="choice-card personal" onclick="openDatabase('personal')"><span>★</span><b>المتشابهات الشخصية</b><small>معتمدة وقابلة للإضافة والتعديل</small><em id="personalCountHome">0 مجموعة</em></button><button class="choice-card auto" onclick="openDatabase('auto')"><span>⚙</span><b>المتشابهات الآلية</b><small>مرشحات آلية للمراجعة</small><em id="autoCountHome">0 مجموعة</em></button></div></section></main>
<section id="workspace" class="workspace hidden">
  <div class="workspace-shell">
    <div class="workspace-main">
      <div class="dashboard-body">
        <aside id="detailPanel" class="detail-panel">
          <div id="detailPanelContent" class="detail-panel-content"></div>
        </aside>
        <div id="groups" class="groups" data-testid="database-view"></div>
        <div class="dashboard-side">
          <div class="toolbar workspace-toolbar workspace-side-card"><div><h2 id="dbTitle">قاعدة البيانات</h2><p id="dbSubTitle">—</p></div><div class="tools toolbar-tools"><button id="mainSearchBtn" data-testid="btn-search" class="icon-btn outline-icon main-search-btn" title="بحث" onclick="openMainSearchUI()" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg><span class="btn-text">بحث</span></button><div id="mainSearchWrap" class="main-search-wrap hidden"><input id="searchInput" data-testid="search-input" placeholder="ابحث..." oninput="renderActiveGroups()"><button class="outline-icon" onclick="clearSearch()" aria-label="إلغاء" title="إلغاء"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="btn-text">إلغاء</span></button><button class="danger" title="إغلاق" onclick="closeMainSearchUI()" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="btn-text">إغلاق</span></button></div><button class="primary" onclick="openAddModal()" aria-label="إضافة متشابه" title="إضافة متشابه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg><span class="btn-text">إضافة</span></button><button onclick="toggleAllGroups()" id="toggleAllBtn" aria-label="فتح/طي الكل" title="فتح/طي الكل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="btn-text">فتح الكل</span></button><button id="syncGitHubBtn" onclick="manualSyncGitHub()" aria-label="مزامنة" title="مزامنة GitHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span class="btn-text">مزامنة</span></button><button onclick="exportActiveDatabase()" data-testid="btn-export" aria-label="تصدير" title="تصدير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="btn-text">تصدير</span></button><button onclick="openAppSettings()" aria-label="إعدادات" title="إعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span class="btn-text">إعدادات</span></button></div></div>
          <section class="filter-card workspace-filter-card" id="surahFilterSection"><div class="filter-head"><div class="filter-title-wrap"><b>🔍 تصفية حسب السورة</b><small id="filterStatus">المعروض الآن: كل السور</small></div><div class="filter-bar-row"><div class="filter-inline-sort" aria-label="خيارات العرض والنتائج">
  <label for="displayMode">طريقة عرض المجموعات</label>
  <div class="sort-select-wrap" aria-label="تغيير طريقة العرض" title="تغيير طريقة العرض"><select id="displayMode" data-testid="sort-control" onchange="setDisplayMode(this.value)">
    <option value="original">Original Order — الترتيب الأصلي</option>
    <option value="sort-surah">Sort by Surah</option>
    <option value="group-surah">Group by Surah</option>
    <option value="newest">Newest First</option>
    <option value="most-verses">Most Verses First</option>
  </select>
  <span id="counter" class="result-counter" data-testid="record-count">عدد النتائج: 0</span>
</div><div class="filter-actions"><button id="onlyResultsBtn" class="active" onclick="toggleOnlyWithResults()">بها نتائج فقط</button><button onclick="clearSurahFilter()">عرض الكل</button><button onclick="toggleSurahFilterPanel()" id="surahFilterToggleBtn">إغلاق الفلتر ▴</button></div></div></div>
          <div class="workspace-status-bar-inline" style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;">
            <div id="activeFilterChips" class="active-filter-chips"></div>
            <div id="surahIndexBar" class="surah-index-bar"></div>
          </div><div id="surahFilterPanel"><input id="surahFilterSearch" class="wide-input" placeholder="ابحث باسم السورة أو رقمها..." oninput="renderSurahFilter()"><div class="range-tabs"><button onclick="setSurahRange('all')" class="active" data-range="all">الكل</button><button onclick="setSurahRange('1-30')" data-range="1-30">1-30</button><button onclick="setSurahRange('31-60')" data-range="31-60">31-60</button><button onclick="setSurahRange('61-90')" data-range="61-90">61-90</button><button onclick="setSurahRange('91-114')" data-range="91-114">91-114</button></div><h4>الأكثر وجودًا</h4><div id="topSurahGrid" class="surah-grid top"></div><div class="surah-count-line" id="surahCountLine"></div><div id="surahFilterGrid" class="surah-grid"></div></div></section>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="modalRoot"></section><button class="floating-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="js/group-actions.js?v=v82b_split_app"></script>
<script src="js/add-edit.js?v=v82b_split_app"></script>
<script src="js/quran-search.js?v=v82b_smartengine"></script>
<script src="js/navigation.js?v=v82b_split_app"></script>

<script src="js/github-sync.js?v=v82b_split_app"></script>
<script src="js/settings.js?v=v82b_split_app"></script>
<script src="js/export-tools.js?v=v82b_split_app"></script>

</body>
</html>
