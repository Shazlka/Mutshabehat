# Configurable Excel column mapping for the Qiraat bulk importer.
#
# Each canonical field lists every header spelling (Arabic + English, with/without diacritics,
# common typos) that should map to it. The importer normalizes a header before matching:
# strips whitespace/tashkeel, folds alef/ya variants, lowercases Latin text.
#
# A header found in the sheet that is NOT in ANY list below is left UNMAPPED and reported —
# never silently guessed (task requirement #5: "Flag ambiguous mappings for review.").
#
# To support a new spreadsheet layout, add the new header spelling to the right list here.
# Do not change field names on the right (those are read by scripts/qiraat/import_excel.py).

