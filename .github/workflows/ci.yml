name: 🔬 Mutashabehat CI — Test Suite

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:

  unit-tests:
    name: 🧪 Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

  e2e-tests:
    name: 🌐 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install serve
        run: npm install -g serve

      - name: Run E2E Tests
        run: npm run test:e2e
        timeout-minutes: 30
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
visual-tests:
    name: 🎨 Visual Regression Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Visual Tests (update snapshots)
        run: npx playwright test --project=visual --update-snapshots
        continue-on-error: true

      - name: Commit Linux Baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.js-snapshots/*-linux.png || true
          git diff --staged --quiet || git commit -m "ci: update Linux visual baselines [skip ci]"
          git push || true

      - name: Run Visual Tests (compare)
        run: npx playwright test --project=visual
  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          echo "✅ Unit tests passed"
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "⚠️ E2E tests failed — check Playwright report"
          else
            echo "✅ E2E tests passed"
          fi
